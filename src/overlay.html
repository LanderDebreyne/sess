<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sess overlay</title>
  <style>
    :root {
      --bg: #110522;
      --bg-grid: rgba(255, 255, 255, 0.08);
      --shell-1: #ffd84d;
      --shell-2: #ff62c0;
      --shell-3: #8b5cff;
      --panel-hi: #3a1570;
      --panel-low: #120425;
      --ink: #f8f2ff;
      --blue: #54c6ff;
      --green: #73ff85;
      --yellow: #ffe76a;
      --pink: #ff6ad5;
      --line: #06010d;
      --bevel-hi: rgba(255, 255, 255, 0.72);
      --bevel-low: rgba(32, 0, 63, 0.95);
      --warn: #ffe76a;
      --shadow: 14px 14px 0 rgba(0, 0, 0, 0.4);
      --mono: "Courier New", "Lucida Console", monospace;
      --sans: Verdana, Geneva, Tahoma, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        radial-gradient(circle at top, rgba(255, 106, 213, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(84, 198, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #22053e, #110522 56%, #060012);
      background-size: 26px 26px, 26px 26px, auto, auto, auto;
      color: var(--ink);
      font-family: var(--sans);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .shell {
      width: min(1280px, 96vw);
      height: min(720px, 88vh);
      position: relative;
      overflow: hidden;
      border: 3px solid var(--line);
      background: linear-gradient(135deg, var(--shell-1), var(--shell-2) 32%, #8b5cff 68%, var(--blue));
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.85),
        inset -2px -2px 0 rgba(44, 0, 89, 0.95),
        var(--shadow);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 3px solid var(--line);
      background:
        linear-gradient(180deg, rgba(0,0,0,0.14), rgba(255,255,255,0.08)),
        linear-gradient(180deg, #2c0d56, #140629);
      box-shadow:
        inset 2px 2px 0 var(--bevel-hi),
        inset -2px -2px 0 var(--bevel-low);
      pointer-events: none;
    }

    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.06) 50%, transparent 50%);
      background-size: 100% 4px;
      mix-blend-mode: soft-light;
      opacity: 0.28;
      pointer-events: none;
    }

    .window-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 12px;
      border: 3px solid var(--line);
      background: linear-gradient(90deg, #ffd84d, #ff6ad5 36%, #8b5cff 70%, #54c6ff);
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.8),
        inset -2px -2px 0 rgba(67, 17, 116, 0.95);
      z-index: 2;
    }

    .window-title {
      min-width: 0;
      color: #16031b;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .window-dot {
      width: 18px;
      height: 18px;
      border: 2px solid var(--line);
      box-shadow:
        inset 1px 1px 0 rgba(255, 255, 255, 0.72),
        inset -1px -1px 0 rgba(0, 0, 0, 0.28);
    }

    .window-dot.is-pink { background: var(--pink); }
    .window-dot.is-yellow { background: var(--yellow); }
    .window-dot.is-green { background: var(--green); }

    .chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 231, 106, 0.16), transparent 16%),
        radial-gradient(circle at 82% 18%, rgba(255, 106, 213, 0.18), transparent 18%),
        radial-gradient(circle at 80% 84%, rgba(84, 198, 255, 0.18), transparent 20%);
      opacity: 0.85;
    }

    .hud {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      padding: 78px 24px 24px;
      z-index: 1;
    }

    .panel-stack {
      display: grid;
      position: relative;
      min-height: 0;
      border: 3px solid var(--line);
      background: linear-gradient(180deg, var(--panel-hi), var(--panel-low));
      box-shadow:
        inset 2px 2px 0 var(--bevel-hi),
        inset -2px -2px 0 var(--bevel-low);
      overflow: hidden;
    }

    .panel {
      grid-area: 1 / 1;
      position: relative;
      padding: 20px;
      min-width: 0;
      min-height: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 220ms steps(4), transform 220ms steps(4);
      pointer-events: none;
      color: var(--ink);
      z-index: 0;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(84, 198, 255, 0.08), transparent 18%, transparent 82%, rgba(115, 255, 133, 0.08)),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%);
      pointer-events: none;
    }

    .panel.is-active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      z-index: 1;
    }

    .title-panel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      align-content: stretch;
    }

    .title-session {
      font-size: clamp(36px, 7vw, 92px);
      line-height: 0.9;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      max-width: none;
      text-wrap: pretty;
      color: #fff7bf;
      text-shadow: 4px 4px 0 rgba(255, 106, 213, 0.38);
    }

    .title-empty {
      color: #f9e4ff;
      text-shadow: 4px 4px 0 rgba(84, 198, 255, 0.24);
    }

    .title-summary {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .metric {
      min-width: 0;
      padding: 12px 14px;
      border: 3px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02)), #2a0d50;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.72),
        inset -2px -2px 0 rgba(15, 0, 35, 0.95);
    }

    .metric:nth-child(1) { background-color: #2434a3; }
    .metric:nth-child(2) { background-color: #8b1368; }
    .metric:nth-child(3) { background-color: #1f6b3c; }

    .metric-label {
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #fff5bf;
      margin-bottom: 10px;
    }

    .metric-value {
      font-size: clamp(20px, 2vw, 30px);
      line-height: 1.1;
      font-weight: 700;
    }

    .warning {
      min-height: 1.4em;
      margin: 0;
      color: var(--warn);
      font-family: var(--mono);
      font-size: 13px;
      max-width: 72ch;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .scroll-panel {
      display: grid;
      grid-template-rows: 1fr;
      gap: 0;
      min-height: 0;
    }

    .scroll-window {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 3px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.1), transparent 12%),
        #120425;
      padding: 14px 16px;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.58),
        inset -2px -2px 0 rgba(0,0,0,0.58);
    }

    .scroll-track {
      will-change: transform;
    }

    .scroll-copy + .scroll-copy {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 3px dashed rgba(255, 231, 106, 0.42);
    }

    .notes {
      font-size: var(--notes-size, 28px);
      line-height: 1.55;
      color: #f8f2ff;
    }

    .notes h1, .notes h2, .notes h3 {
      margin: 0 0 0.7em;
      line-height: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #9fe7ff;
      text-shadow: 3px 3px 0 rgba(255, 106, 213, 0.32);
    }

    .notes p, .notes ul, .notes pre {
      margin: 0 0 0.9em;
    }

    .notes ul {
      padding-left: 1.15em;
    }

    .notes li::marker {
      color: var(--green);
    }

    .notes code {
      font-family: var(--mono);
      padding: 0.12em 0.32em;
      border: 2px solid var(--line);
      background: #ffe76a;
      color: #220030;
    }

    .notes pre {
      padding: 16px;
      overflow: hidden;
      white-space: pre-wrap;
      border: 3px solid var(--line);
      background: #090113;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.22),
        inset -2px -2px 0 rgba(84, 198, 255, 0.28);
    }

    .todo-list {
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 14px;
      align-items: start;
      padding: 12px;
      border: 3px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%), rgba(64, 18, 110, 0.72);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.58),
        inset -1px -1px 0 rgba(0,0,0,0.58);
    }

    .todo-index {
      min-width: 56px;
      padding: 5px 7px;
      background: var(--yellow);
      border: 2px solid var(--line);
      color: #2a002c;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-align: center;
    }

    .todo-body {
      display: grid;
      gap: 6px;
    }

    .todo-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .todo-state,
    .todo-detail {
      padding: 4px 8px;
      border: 2px solid var(--line);
      font-size: 12px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .todo-state {
      color: #17061f;
      background: #f1d9ff;
    }

    .todo-state.is-open {
      background: var(--blue);
      color: #071828;
    }

    .todo-state.is-progress {
      background: var(--pink);
      color: #2b0029;
    }

    .todo-state.is-done {
      background: var(--green);
      color: #06220d;
    }

    .todo-text {
      font-size: clamp(16px, 1.45vw, 22px);
      line-height: 1.35;
      color: #fff8cf;
    }

    .todo-detail {
      color: #fcefff;
      background: rgba(255,255,255,0.1);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-height: 0;
    }

    .panel-indicators {
      display: flex;
      gap: 10px;
    }

    .panel-indicator {
      width: 34px;
      height: 12px;
      border: 2px solid var(--line);
      background: #2b0b4d;
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.4),
        inset -1px -1px 0 rgba(0,0,0,0.54);
      transition: transform 180ms steps(3), background 180ms steps(3);
    }

    .panel-indicator.is-active {
      transform: translateY(-2px);
      background: var(--green);
    }

    @media (max-width: 960px) {
      .title-summary { grid-template-columns: 1fr; }
    }

    @media (max-width: 820px) {
      body { padding: 10px; }
      .shell::before { inset: 12px; }
      .window-bar {
        top: 12px;
        left: 12px;
        right: 12px;
      }
      .window-title { font-size: 12px; }
      .hud { padding: 66px 16px 16px; }
      .panel { padding: 16px; }
      .panel-indicator { width: 26px; }
    }

    @media (max-width: 560px) {
      .shell {
        width: 100vw;
        height: 100vh;
      }
      .title-session {
        font-size: clamp(32px, 10vw, 60px);
      }
      .scroll-window {
        padding: 12px;
      }
      .todo-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="window-bar">
      <div class="window-title">SESS OVERLAY.EXE</div>
      <div class="window-actions" aria-hidden="true">
        <span class="window-dot is-pink"></span>
        <span class="window-dot is-yellow"></span>
        <span class="window-dot is-green"></span>
      </div>
    </div>
    <div class="chrome"></div>
    <section class="hud">
      <div class="panel-stack" id="panel-stack">
        <section class="panel title-panel is-active" data-panel="title" data-panel-key="title">
          <div class="title-session title-empty" id="session-title">No active session</div>
          <div>
            <div class="title-summary">
              <div class="metric">
                <div class="metric-label">Session</div>
                <div class="metric-value" id="elapsed">0s</div>
              </div>
              <div class="metric">
                <div class="metric-label">Open Todos</div>
                <div class="metric-value" id="open-count">0</div>
              </div>
              <div class="metric">
                <div class="metric-label">Completed</div>
                <div class="metric-value" id="done-count">0</div>
              </div>
            </div>
          </div>
          <p class="warning" id="warning"></p>
        </section>
        <section class="panel scroll-panel" data-panel="notes" data-panel-key="notes">
          <div class="scroll-window">
            <div class="scroll-track" id="notes-track"></div>
          </div>
        </section>
      </div>
      <footer class="footer">
        <div class="panel-indicators" id="panel-indicators"></div>
      </footer>
    </section>
  </main>
  <script>
    const panelStack = document.getElementById("panel-stack");
    const indicatorBar = document.getElementById("panel-indicators");
    const stateEls = {
      sessionTitle: document.getElementById("session-title"),
      elapsed: document.getElementById("elapsed"),
      openCount: document.getElementById("open-count"),
      doneCount: document.getElementById("done-count"),
      warning: document.getElementById("warning"),
      notesTrack: document.getElementById("notes-track"),
    };

    let panels = [];
    let indicators = [];
    let currentPanel = 0;
    let rotateTimer = null;
    let rotateSeconds = 0;
    let latestState = null;
    let resizeFrame = null;
    const scrollers = new Map();

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, "").split("\n");
      const chunks = [];
      let paragraph = [];
      let list = [];
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        chunks.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function flushList() {
        if (!list.length) return;
        chunks.push(`<ul>${list.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
        list = [];
      }

      function flushCode() {
        if (!codeLines.length) return;
        chunks.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        codeLines = [];
      }

      for (const line of lines) {
        if (line.startsWith("```")) {
          flushParagraph();
          flushList();
          if (inCode) flushCode();
          inCode = !inCode;
          continue;
        }
        if (inCode) {
          codeLines.push(line);
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          flushList();
          chunks.push(`<h${heading[1].length}>${renderInlineMarkdown(heading[2])}</h${heading[1].length}>`);
          continue;
        }
        const bullet = line.match(/^[-*]\s+(.*)$/);
        if (bullet) {
          flushParagraph();
          list.push(bullet[1]);
          continue;
        }
        if (line.trim() === "") {
          flushParagraph();
          flushList();
          continue;
        }
        paragraph.push(line.trim());
      }

      flushParagraph();
      flushList();
      flushCode();
      return chunks.join("") || "<p>Nothing in notes yet.</p>";
    }

    function renderTodos(todos) {
      if (!todos.length) {
        return `<div class="todo-list"><div class="todo-item"><div class="todo-index">--</div><div class="todo-body"><div class="todo-meta"><div class="todo-state is-open">idle</div></div><div class="todo-text">No todos yet.</div></div></div></div>`;
      }
      return `<div class="todo-list">` + todos.map((todo) => `
        <article class="todo-item">
          <div class="todo-index">#${todo.index}</div>
          <div class="todo-body">
            <div class="todo-meta">
              <div class="todo-state ${todo.state === "done" ? "is-done" : todo.state === "in progress" ? "is-progress" : "is-open"}">${escapeHtml(todo.state)}</div>
              ${todo.elapsed ? `<div class="todo-detail">at ${escapeHtml(todo.elapsed)}</div>` : ""}
            </div>
            <div class="todo-text">${escapeHtml(todo.description)}</div>
          </div>
        </article>
      `).join("") + `</div>`;
    }

    function createTodoItem(todo) {
      const article = document.createElement("article");
      article.className = "todo-item";
      article.innerHTML = `
        <div class="todo-index">#${todo.index}</div>
        <div class="todo-body">
          <div class="todo-meta">
            <div class="todo-state ${todo.state === "done" ? "is-done" : todo.state === "in progress" ? "is-progress" : "is-open"}">${escapeHtml(todo.state)}</div>
            ${todo.elapsed ? `<div class="todo-detail">at ${escapeHtml(todo.elapsed)}</div>` : ""}
          </div>
          <div class="todo-text">${escapeHtml(todo.description)}</div>
        </div>
      `;
      return article;
    }

    function paginateTodos(todos) {
      if (!todos.length) return [[]];

      const measurePanel = document.createElement("section");
      measurePanel.className = "panel scroll-panel is-active";
      measurePanel.style.opacity = "0";
      measurePanel.style.visibility = "hidden";
      measurePanel.style.pointerEvents = "none";
      measurePanel.style.zIndex = "-1";
      measurePanel.innerHTML = `<div class="scroll-window"><div class="todo-list"></div></div>`;
      panelStack.appendChild(measurePanel);

      const scrollWindow = measurePanel.querySelector(".scroll-window");
      const list = measurePanel.querySelector(".todo-list");
      const pages = [];
      let page = [];

      for (const todo of todos) {
        const item = createTodoItem(todo);
        list.appendChild(item);
        if (scrollWindow.scrollHeight > scrollWindow.clientHeight && page.length > 0) {
          list.removeChild(item);
          pages.push(page);
          page = [todo];
          list.innerHTML = "";
          list.appendChild(item);
        } else {
          page.push(todo);
        }
      }

      if (page.length || pages.length === 0) pages.push(page);
      measurePanel.remove();
      return pages;
    }

    function fitNotesTrack(track) {
      const container = track.parentElement;
      const content = track.firstElementChild;
      if (!container || !content) return;

      const minSize = 14;
      const maxSize = Math.min(30, Math.max(18, Math.floor(container.clientWidth / 28)));
      let best = minSize;
      let low = minSize;
      let high = maxSize;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        content.style.setProperty("--notes-size", `${mid}px`);
        if (content.scrollHeight <= container.clientHeight) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      content.style.setProperty("--notes-size", `${best}px`);
    }

    function renderTodoPanels(todos) {
      const contentKey = `${panelStack.clientWidth}x${panelStack.clientHeight}:${JSON.stringify(todos || [])}`;
      if (panelStack.dataset.todoKey === contentKey) return;
      const activeKey = panels[currentPanel]?.dataset.panelKey || "title";
      for (const panel of panelStack.querySelectorAll('[data-panel="todos"]')) panel.remove();
      const pages = paginateTodos(todos || []);
      pages.forEach((page, index) => {
        const section = document.createElement("section");
        section.className = "panel scroll-panel";
        section.dataset.panel = "todos";
        section.dataset.panelKey = `todos-${index}`;
        section.innerHTML = `
          <div class="scroll-window">
            ${renderTodos(page)}
          </div>
        `;
        panelStack.appendChild(section);
      });
      panelStack.dataset.todoKey = contentKey;
      refreshPanels(activeKey);
    }

    function refreshPanels(preferredKey) {
      panels = [...panelStack.querySelectorAll(".panel")];
      indicatorBar.innerHTML = panels.map(() => `<span class="panel-indicator"></span>`).join("");
      indicators = [...indicatorBar.querySelectorAll(".panel-indicator")];
      const preferredIndex = preferredKey ? panels.findIndex((panel) => panel.dataset.panelKey === preferredKey) : -1;
      setPanel(preferredIndex >= 0 ? preferredIndex : Math.min(currentPanel, Math.max(0, panels.length - 1)));
    }

    function startLoop(track, seconds) {
      stopLoop(track);
      const content = track.firstElementChild;
      if (!content) return;
      const cycleHeight = content.offsetHeight;
      if (!cycleHeight || cycleHeight <= track.parentElement.clientHeight) {
        track.style.transform = "translateY(0)";
        return;
      }
      let startTime = null;
      const durationMs = Math.max(6000, seconds * 1000);
      function frame(timestamp) {
        if (startTime === null) startTime = timestamp;
        const progress = ((timestamp - startTime) % durationMs) / durationMs;
        const offset = progress * cycleHeight;
        track.style.transform = `translateY(${-offset}px)`;
        const id = requestAnimationFrame(frame);
        scrollers.set(track, id);
      }
      const id = requestAnimationFrame(frame);
      scrollers.set(track, id);
    }

    function stopLoop(track) {
      const id = scrollers.get(track);
      if (id) cancelAnimationFrame(id);
      scrollers.delete(track);
      track.style.transform = "translateY(0)";
    }

    function setScrollableContent(track, innerHtml, className, seconds) {
      const contentKey = `${className}:${track.parentElement.clientWidth}:${track.parentElement.clientHeight}:${innerHtml}`;
      if (track.dataset.contentKey === contentKey) return;
      track.dataset.contentKey = contentKey;
      track.innerHTML = `
        <div class="scroll-copy ${className}">${innerHtml}</div>
        <div class="scroll-copy ${className}" aria-hidden="true">${innerHtml}</div>
      `;
      requestAnimationFrame(() => {
        fitNotesTrack(track);
        startLoop(track, seconds);
      });
    }

    function setPanel(index) {
      if (!panels.length) return;
      currentPanel = ((index % panels.length) + panels.length) % panels.length;
      panels.forEach((panel, i) => panel.classList.toggle("is-active", i === currentPanel));
      indicators.forEach((indicator, i) => indicator.classList.toggle("is-active", i === currentPanel));
    }

    function configureRotation(seconds) {
      if (rotateTimer && rotateSeconds === seconds) return;
      if (rotateTimer) clearInterval(rotateTimer);
      rotateSeconds = seconds;
      rotateTimer = setInterval(() => setPanel(currentPanel + 1), Math.max(4, seconds) * 1000);
    }

    function applyState(data) {
      latestState = data;
      const hasSession = Boolean(data.session_name);
      stateEls.sessionTitle.textContent = hasSession ? data.session_name : "No active session";
      stateEls.sessionTitle.classList.toggle("title-empty", !hasSession);
      stateEls.elapsed.textContent = data.elapsed;
      stateEls.openCount.textContent = String(data.open_todos.length);
      stateEls.doneCount.textContent = String(data.done_count);
      stateEls.warning.textContent = data.warning || "";
      renderTodoPanels(data.todos || []);
      setScrollableContent(stateEls.notesTrack, `<div class="notes">${renderMarkdown(data.notes_markdown || "")}</div>`, "notes", data.ui.notes_scroll_seconds);
      configureRotation(data.ui.rotate_seconds);
    }

    function rerenderForLayout() {
      if (!latestState) return;
      renderTodoPanels(latestState.todos || []);
      stateEls.notesTrack.dataset.contentKey = "";
      setScrollableContent(stateEls.notesTrack, `<div class="notes">${renderMarkdown(latestState.notes_markdown || "")}</div>`, "notes", latestState.ui.notes_scroll_seconds);
    }

    async function poll() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        applyState(data);
      } catch (error) {
        stateEls.warning.textContent = String(error);
      }
    }

    refreshPanels("title");
    poll();
    setInterval(poll, 1000);
    window.addEventListener("resize", () => {
      if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        rerenderForLayout();
      });
    });
  </script>
</body>
</html>
